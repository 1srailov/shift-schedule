services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shifts
      POSTGRES_PASSWORD: shifts
      POSTGRES_DB: shifts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifts"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://shifts:shifts@db:5432/shifts
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
